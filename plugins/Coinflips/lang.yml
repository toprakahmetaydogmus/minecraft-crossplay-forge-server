stats:
  format:
    - " "
    - "&#ECE20CStatistics for &f%player%"
    - "&#ECE20C➤ &7Wins: &a%wins%"
    - "&#ECE20C➤ &7Losses: &c%losses%"
    - "&#ECE20C➤ &7Ratio: &e%ratio%%"
    - "&#ECE20C➤ &7Total Bet: &f%total_bet%"
    - "&#ECE20C➤ &7Profit: &b%profit%"
    - " "

top:
  header: "&#ECE20C&lTop 10 Players"
  format: "&6#%position% &f%player% &7- Wins: &a%wins% &7- Profit: &b%profit%"

gui:
  open-failed: "&#FF4D4D&l✘ &#FF4D4DFailed to open GUI!"

