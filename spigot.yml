      - ancient_debris
      - nether_gold_ore
      - nether_quartz_ore
      - chest
      - ender_chest
      - spawner
      replacement-blocks:
      - stone
      - deepslate
      - tuff
      - diorite
      - andesite
      - granite
      - netherrack
      - basalt
      - blackstone
    seed-village: 10387312
    seed-desert: 14357617
    seed-igloo: 14357618
    seed-jungle: 14357619
    seed-swamp: 14357620
    seed-monument: 10387313
    seed-shipwreck: 165745295
    seed-ocean: 14357621
    seed-outpost: 165745296
    seed-endcity: 10387313
    seed-slime: 987234911
    seed-nether: 30084232
    seed-mansion: 10387319
    seed-fossil: 14357921
    seed-portal: 34222645
    entity-tracking-range:
      players: 48
      animals: 24
      monsters: 24
      misc: 12
      display: 64
      other: 32
    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    hopper-amount: 1
